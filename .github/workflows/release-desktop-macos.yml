name: Release Foundry Desktop (macOS)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to GitHub Releases. Requires main and every Apple signing secret. Off builds a workflow artifact only."
        required: true
        type: boolean
        default: false

run-name: ${{ inputs.publish && 'Release Foundry desktop' || 'Build Foundry desktop (no publish)' }}

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  NODE_VERSION: "22.x"
  PNPM_VERSION: "9.15.0"

permissions:
  contents: read

concurrency:
  group: release-desktop-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build macOS arm64 app
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./apps/desktop/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check publish preconditions
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Publishing must run from main, got ${GITHUB_REF}."
            exit 1
          fi

          if [[ "$VERSION" == *-* ]]; then
            echo "::error::Refusing to publish prerelease version ${VERSION}."
            exit 1
          fi

          missing=()
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if [[ "${#missing[@]}" -gt 0 ]]; then
            echo "::error::Publishing needs a signed, notarized app. Missing secrets: ${missing[*]}."
            exit 1
          fi

          if gh release view "desktop-v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Release desktop-v${VERSION} already exists. Bump the version with scripts/bump-version.mjs."
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Verify arm64 runner
        run: test "$(uname -m)" = "arm64"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --filter '!@bb/mobile'

      - name: Typecheck desktop and launcher
        run: pnpm exec turbo run typecheck --filter=@bb/desktop --filter=bb-app --output-logs=new-only

      - name: Build desktop
        run: pnpm exec turbo run build --filter=@bb/desktop --output-logs=new-only

      - name: Install Electron before parallel tests
        run: ELECTRON_RUN_AS_NODE=1 pnpm --filter @bb/desktop exec electron --version

      - name: Test desktop and launcher
        run: pnpm exec turbo run test --filter=@bb/desktop --filter=bb-app --force --output-logs=new-only

      - name: Package arm64 app
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CSC_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm exec turbo run desktop:build --filter=@bb/desktop --force --output-logs=new-only

      - name: Smoke test packaged app
        run: pnpm exec turbo run smoke:packaged --filter=@bb/desktop --force --output-logs=new-only

      - name: Generate version feed
        run: pnpm --dir apps/desktop run desktop:version-feed

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundry-desktop-macos-arm64
          retention-days: 14
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac.yml
            apps/desktop/release/desktop-version.json
          if-no-files-found: error

  publish:
    name: Publish to GitHub Releases
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: foundry-desktop-macos-arm64
          path: release

      - name: Publish versioned and moving releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail

          assets=()
          for pattern in release/desktop-version.json release/latest-mac.yml release/*.dmg release/*.zip release/*.blockmap; do
            matches=($pattern)
            if [[ ! -e "${matches[0]}" ]]; then
              echo "::error::No release artifact matched ${pattern}."
              exit 1
            fi
            assets+=("${matches[@]}")
          done

          version_tag="desktop-v${VERSION}"
          latest_tag="desktop-latest"
          notes="Foundry ${VERSION} for macOS (Apple silicon). Download the .dmg."

          gh release create "$version_tag" "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "Foundry ${VERSION}" \
            --notes "$notes" \
            --latest

          git tag -f "$latest_tag" "$GITHUB_SHA"
          git push --force origin "refs/tags/${latest_tag}"

          if gh release view "$latest_tag" >/dev/null 2>&1; then
            gh release edit "$latest_tag" \
              --target "$GITHUB_SHA" \
              --title "Foundry update feed" \
              --notes "Moving update feed for installed Foundry apps. Download from the latest versioned release instead." \
              --latest=false

            gh release view "$latest_tag" --json assets --jq '.assets[].name' | while IFS= read -r asset_name; do
              if [[ -n "$asset_name" ]]; then
                gh release delete-asset "$latest_tag" "$asset_name" --yes
              fi
            done

            gh release upload "$latest_tag" "${assets[@]}"
          else
            gh release create "$latest_tag" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "Foundry update feed" \
              --notes "Moving update feed for installed Foundry apps. Download from the latest versioned release instead." \
              --latest=false
          fi

      - name: Verify the update feed
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail

          feed_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/desktop-latest/desktop-version.json"
          for attempt in $(seq 1 12); do
            if curl -fsSL "$feed_url" | grep -q "\"${VERSION}\""; then
              echo "Update feed reports ${VERSION}."
              echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/tag/desktop-v${VERSION}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Feed does not report ${VERSION} yet (attempt ${attempt}/12)."
            sleep 10
          done

          echo "::error::Update feed at ${feed_url} never reported ${VERSION}."
          exit 1
